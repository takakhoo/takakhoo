<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0d10"/><stop offset="1" stop-color="#16130d"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6dc9a"/><stop offset=".5" stop-color="#e6b456"/><stop offset="1" stop-color="#a8722a"/></linearGradient>
